server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Keep redirects relative when this server is behind the HTTPS proxy.
    absolute_redirect off;

    # Preserve the HTTP 404 while allowing React to render its NotFoundPage.
    error_page 404 /_seo-404.html;

    location = /_seo-404.html {
        internal;
        alias /usr/share/nginx/html/_spa.html;
        add_header X-Robots-Tag "noindex" always;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /analysis {
        return 301 /$is_args$args;
    }

    location = /analysis/ {
        return 301 /$is_args$args;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location = / {
        try_files /index.html =404;
    }

    # Keep this allowlist in sync with AppContainer.tsx when adding pages.
    location ~ ^/(?<seo_page>about|contacts|articles|privacy-policy|consent-personal-data)/?$ {
        try_files /_pages/$seo_page.html =404;
    }

    location ~ ^/analizy/(?<analysis_group>[a-z-]+)(?<slash>/?)$ {
        if ($slash = "") { return 301 /analizy/$analysis_group/$is_args$args; }
        try_files /_pages/analizy/$analysis_group.html =404;
    }

    # noindex pages stay crawlable so robots can read this response header.
    # This controls indexing only, not authorization or access to results.
    location ~ ^/result/[^/]+/?$ {
        add_header X-Robots-Tag "noindex" always;
        try_files /_result.html =404;
    }

    location ~ ^/(?<service_page>admin/(translations|units|ages|descriptions|analysisPoints|analysisType)|logout|test)/?$ {
        add_header X-Robots-Tag "noindex" always;
        try_files /_pages/$service_page.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
