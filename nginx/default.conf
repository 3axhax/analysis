log_format extended '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" '
                'rt=$request_time uct="$upstream_connect_time" '
                'uht="$upstream_header_time" urt="$upstream_response_time"';

access_log /var/log/nginx/access.log extended;
error_log /var/log/nginx/error.log warn;

server {
    listen 80;
    server_name proanalize.ru www.proanalize.ru;

    access_log /var/log/nginx/http_access.log extended;

    return 301 https://proanalize.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.proanalize.ru;

    # The certificate must cover both proanalize.ru and www.proanalize.ru.
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://proanalize.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name proanalize.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    access_log /var/log/nginx/https_access.log extended;
    error_log /var/log/nginx/https_error.log warn;

    location = /webhooks/kartex-telegram {
        if ($request_method != POST) { return 405; }

        client_max_body_size 256k;
        proxy_pass https://start.kartex.ru/integrations/max/telegram-event.php;
        proxy_http_version 1.1;
        proxy_set_header Host start.kartex.ru;
        proxy_set_header Connection "";
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
    }

    location /api/ {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://server_analysis:5050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://client_analysis:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
