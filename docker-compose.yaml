services:
  nginx_proxy:
    image: nginx:alpine
    container_name: nginxProxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - client_analysis
      - server_analysis
    networks:
      - app_network
    restart: unless-stopped

  server_analysis:
    container_name: serverAnalysis
    build:
      context: ./server
      dockerfile: DockerfileServer
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/server/uploads
    expose:
      - "5050"
    depends_on:
      postgres_analysis:
        condition: service_healthy
      python_pdf_parser:
        condition: service_healthy
    networks:
      - app_network
      - parser_internal
    restart: unless-stopped

  postgres_analysis:
    container_name: postgresAnalysis
    image: postgres:18
    env_file:
      - ./.postgres.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

  client_analysis:
    container_name: clientAnalysis
    build:
      context: ./client
      dockerfile: DockerfileClient
    expose:
      - "80"
    networks:
      - app_network
    restart: unless-stopped

  python_pdf_parser:
    container_name: pythonPDFParser
    build:
      context: ./python-microservice
      dockerfile: DockerfilePythonMicroservice
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PDF_MAX_PAGES=5
      - PDF_PROCESS_TIMEOUT_SECONDS=45
      - PDF_WORKER_MEMORY_MB=512
      - PDF_MAX_CONCURRENT_REQUESTS=2
    networks:
      - parser_internal
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    restart: unless-stopped

networks:
  app_network:
    driver: bridge
  parser_internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
